name: Spotless Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run Spotless check
        run: mvn -B spotless:check --file automation/pom.xml
